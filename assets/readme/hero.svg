<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">画风图谱 Art Style Archive — 同一场景，41 种画风</title>
  <desc id="desc">深色底标题：画风图谱，9 个基准场景 × 41 种流派 = 369 幅对照作品；右侧是同一咖啡馆雨窗场景的三种画风小框：厚涂油画、极简矢量、中国水墨。</desc>

  <rect width="1200" height="360" rx="26" fill="#121110"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#a39e93">AI ART STYLE MATRIX · 画风图谱</text>
    <text x="56" y="130" font-size="64" font-weight="700" fill="#f5f1ea">画风图谱</text>
    <text x="56" y="170" font-size="23" fill="#e8442e">同一场景，41 种画风 — 9 × 41 = 369 幅对照作品</text>
    <text x="56" y="204" font-size="19" fill="#a39e93">主体与构图固定，只换流派，剥离风格本身的美学特征。</text>
    <g id="chips" font-size="18" fill="#f5f1ea" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#221f1c" stroke="#3a352f" stroke-width="1.5"/><text x="119" y="262">9 个场景</text></g>
      <g><rect x="194" y="238" width="144" height="36" rx="18" fill="#221f1c" stroke="#3a352f" stroke-width="1.5"/><text x="266" y="262">41 种流派</text></g>
      <g><rect x="350" y="238" width="144" height="36" rx="18" fill="#221f1c" stroke="#3a352f" stroke-width="1.5"/><text x="422" y="262">369 幅作品</text></g>
      <g><rect x="506" y="238" width="180" height="36" rx="18" fill="#221f1c" stroke="#3a352f" stroke-width="1.5"/><text x="596" y="262">Gemini vs GPT</text></g>
    </g>
  </g>

  <g id="style-frames" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="760" y="46" font-size="18" fill="#a39e93">同一场景 · 咖啡馆雨窗与猫</text>
    <g id="frame-impasto">
      <rect x="760" y="62" width="120" height="150" rx="10" fill="#2a2118"/>
      <g>
        <rect x="772" y="74" width="96" height="40" rx="6" fill="#c98a3d"/>
        <rect x="772" y="120" width="56" height="52" rx="6" fill="#8a4a2a"/>
        <circle cx="838" cy="146" r="16" fill="#e8c07a"/>
        <rect x="772" y="178" width="96" height="22" rx="6" fill="#5a3a22"/>
      </g>
      <text x="820" y="240" font-size="18" fill="#f5f1ea" text-anchor="middle">#01 厚涂油画</text>
    </g>
    <g id="frame-vector">
      <rect x="900" y="62" width="120" height="150" rx="10" fill="#1d4e89"/>
      <g>
        <circle cx="990" cy="92" r="16" fill="#e8a33d"/>
        <rect x="912" y="120" width="96" height="10" rx="5" fill="#f5f1ea"/>
        <rect x="912" y="140" width="40" height="60" rx="4" fill="#e8442e"/>
        <rect x="960" y="140" width="48" height="60" rx="4" fill="#0f2c4d"/>
      </g>
      <text x="960" y="240" font-size="18" fill="#f5f1ea" text-anchor="middle">#12 极简矢量</text>
    </g>
    <g id="frame-ink">
      <rect x="1040" y="62" width="120" height="150" rx="10" fill="#e8e6dc"/>
      <g stroke="#262624" stroke-linecap="round" fill="none">
        <path d="M1052 90 Q 1080 78 1100 96 T 1148 92" stroke-width="6"/>
        <path d="M1056 130 Q 1090 118 1120 132" stroke-width="4"/>
        <path d="M1060 170 L 1140 170" stroke-width="8"/>
        <path d="M1075 150 Q 1100 138 1125 152" stroke-width="3"/>
      </g>
      <rect x="1040" y="222" width="120" height="30" rx="8" fill="#121110"/>
      <text x="1100" y="240" font-size="18" fill="#f5f1ea" text-anchor="middle">#18 中国水墨</text>
    </g>
    <g id="frames-note" text-anchor="middle">
      <text x="960" y="292" font-size="19" fill="#a39e93">9 场景 × 41 流派，每幅都有完整提示词</text>
    </g>
  </g>
</svg>
