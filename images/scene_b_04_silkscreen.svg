<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-b-04" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b0938"/><stop offset="50%" stop-color="#7209b7"/><stop offset="100%" stop-color="#f72585"/>
    </linearGradient>
    <filter id="glow-b-04">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1920" height="1080" fill="url(#bg-grad-b-04)"/>

  <!-- Scene Specific Artwork Motifs -->
  
            <!-- Stylized Architectural Tram Lines -->
            <polygon points="0,580 1920,520 1920,1080 0,1080" fill="#0f172a" opacity="0.8"/>
            <line x1="0" y1="720" x2="1920" y2="660" stroke="#ffe600" stroke-width="8" stroke-dasharray="24,12"/>
            <!-- Tram Block -->
            <rect x="780" y="480" width="380" height="190" rx="20" fill="#ffe600" opacity="0.9" stroke="#fff" stroke-width="6"/>
            <rect x="820" y="510" width="70" height="60" rx="8" fill="#0f172a"/>
            <rect x="910" y="510" width="70" height="60" rx="8" fill="#0f172a"/>
            <rect x="1000" y="510" width="70" height="60" rx="8" fill="#0f172a"/>
            

  <!-- Stylized Overlay Grid & Texture -->
  <rect width="1920" height="1080" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Master Info Card Banner (Bottom Glass Box) -->
  <g transform="translate(60, 880)">
    <rect width="1800" height="140" rx="24" fill="rgba(10, 15, 30, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
    
    <!-- Number Badge -->
    <rect x="30" y="30" width="80" height="80" rx="16" fill="#ffe600" opacity="0.2"/>
    <rect x="30" y="30" width="80" height="80" rx="16" fill="none" stroke="#ffe600" stroke-width="3"/>
    <text x="70" y="80" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="900" fill="#ffe600" text-anchor="middle">
      04
    </text>

    <!-- Style Names -->
    <text x="140" y="66" font-family="'Noto Serif SC', serif" font-size="32" font-weight="bold" fill="#ffffff">
      丝网版画 / 波普
    </text>
    <text x="140" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="500" fill="#ffe600">
      Silkscreen / Pop Art · 场景 B · 雨后黄昏海滨电车
    </text>

    <!-- Category & Tags on Right -->
    <g transform="translate(1300, 48)">
      <rect x="0" y="0" width="140" height="42" rx="10" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.4)"/>
      <text x="70" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold" fill="#a5b4fc" text-anchor="middle">
        版画印刷
      </text>
      <text x="180" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#94a3b8">
        对位微错版 · 高反差平涂 · 波普招贴
      </text>
    </g>
  </g>
</svg>