<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画风图谱 · 经典艺术与插画流派视觉解构 | Art Style Archive</title>
  
  <!-- Analytics (Umami) -->
  <script
    defer
    src="https://cloud.umami.is/script.js"
    data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"
    data-domains="holynova.github.io"
    data-exclude-search="true"
    data-exclude-hash="true"
  ></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            terracotta: {
              50: '#fdf4f2',
              100: '#fbe8e4',
              200: '#f7d5cc',
              300: '#f0b5a6',
              400: '#e68972',
              500: '#e25c38',
              600: '#c8502e',
              700: '#a63f23',
              800: '#86351f',
              900: '#6f2f1e',
            },
            ochre: {
              400: '#f59e0b',
              500: '#d97706',
              600: '#b45309',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="selection:bg-[#e25c38] selection:text-white min-h-screen text-[#e4e4e7] overflow-x-hidden bg-[#0f1013]">

  <!-- Top Global Navigation Bar (Sticky) -->
  <header class="sticky top-0 z-40 w-full bg-[#0f1013]/95 backdrop-blur-md border-b border-white/[0.08] px-4 lg:px-8 py-2.5 transition-all">
    <div class="max-w-[1720px] mx-auto flex items-center justify-between gap-3 sm:gap-6">
      
      <!-- Left: Brand & Title -->
      <div class="flex items-center gap-3 shrink-0">
        <a href="#" class="flex items-center gap-2.5 group">
          <span class="w-2.5 h-2.5 rounded-full bg-[#e25c38] group-hover:scale-125 transition-transform shadow-[0_0_8px_rgba(226,92,56,0.6)]"></span>
          <div class="flex items-center gap-2">
            <span class="font-serif-editorial text-base sm:text-lg font-bold text-[#fbfbfa] tracking-tight">画风图谱</span>
            <span class="text-[11px] font-mono text-[#888990] hidden md:inline">ART STYLE ARCHIVE</span>
          </div>
        </a>

        <div class="hidden xl:flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-[#15161a] border border-white/[0.06] text-[11px] text-[#a1a1aa] font-mono">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          <span>216 矩阵图谱</span>
        </div>
      </div>

      <!-- Center: Global Search Input -->
      <div class="flex-1 max-w-md mx-1 sm:mx-4">
        <div class="relative w-full">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-[#888990]"></i>
          <input type="text" id="searchInput" placeholder="搜索流派、笔触、大师或 Prompt 关键词... (/) " 
            class="w-full pl-8 pr-8 py-1.5 bg-[#15161a] hover:bg-[#1a1c22] focus:bg-[#1a1c22] border border-white/[0.08] focus:border-[#e25c38] rounded-lg text-xs text-[#fbfbfa] placeholder-[#5c5d64] focus:outline-none transition-all">
          <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-[#888990] hover:text-white">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </div>
      </div>

      <!-- Right: Quick Actions -->
      <div class="flex items-center gap-2 shrink-0">
        <!-- Quick Random Style Pick -->
        <button id="randomStyleBtn" class="px-2.5 py-1.5 rounded-lg bg-[#15161a] hover:bg-[#22252c] text-[#a1a1aa] hover:text-white border border-white/[0.08] text-xs font-medium transition-all flex items-center gap-1.5" title="随机抽取画风灵感">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-400"></i>
          <span class="hidden sm:inline">灵感</span>
        </button>

        <!-- Export Prompts -->
        <button id="exportPromptsBtn" class="px-2.5 py-1.5 rounded-lg bg-[#15161a] hover:bg-[#22252c] text-[#fbfbfa] border border-white/[0.08] text-xs font-medium transition-all flex items-center gap-1.5" title="导出当前场景全部 Prompt">
          <i data-lucide="download" class="w-3.5 h-3.5 text-[#a1a1aa]"></i>
          <span class="hidden sm:inline">导出</span>
        </button>

        <!-- GitHub -->
        <a href="https://github.com/holynova/art-style-showcase" target="_blank" rel="noopener noreferrer" 
           class="p-1.5 rounded-lg bg-[#15161a] hover:bg-[#22252c] text-[#a1a1aa] hover:text-white border border-white/[0.08] transition-all flex items-center justify-center" title="GitHub 仓库">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        </a>
      </div>

    </div>
  </header>

  <!-- Sticky Sub-Nav: 9 Scenes Pill Bar & Streamlined Filter Controls -->
  <div class="sticky top-[53px] z-30 w-full bg-[#0f1013]/90 backdrop-blur-md border-b border-white/[0.06] px-4 lg:px-8 py-2.5 transition-all space-y-2.5">
    <div class="max-w-[1720px] mx-auto space-y-2.5">
      
      <!-- Row 1: 9 Benchmark Scenes Horizontal Tabs (Without Roman Numerals) -->
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5" id="sceneNavContainer">
        <!-- Rendered dynamically -->
      </div>

      <!-- Row 2: Category Filter Pills + Utility Controls -->
      <div class="flex flex-wrap items-center justify-between gap-3 pt-1 border-t border-white/[0.04]">
        
        <!-- Category Filter Pills -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar" id="categoryNavContainer">
          <!-- Rendered dynamically -->
        </div>

        <!-- Right Utilities: Scene Core Prompt & Density Toggle -->
        <div class="flex items-center gap-3 shrink-0 ml-auto">
          <!-- Copy Core Subject Prompt Button -->
          <button id="copyCoreSubjectBtn" class="px-2.5 py-1 rounded-lg bg-[#15161a] hover:bg-[#22252c] text-[#a1a1aa] hover:text-[#e25c38] border border-white/[0.06] text-xs font-mono flex items-center gap-1.5 transition-all" title="复制当前基准场景的主体 Prompt">
            <i data-lucide="crosshair" class="w-3 h-3 text-[#e25c38]"></i>
            <span class="hidden sm:inline">主体 Prompt: </span>
            <span id="activeSceneSubjectPreview" class="max-w-[140px] truncate text-[#c4c4c7]">A stylish woman...</span>
            <i data-lucide="copy" class="w-2.5 h-2.5 opacity-60"></i>
          </button>

          <!-- Density Controls -->
          <div class="flex items-center bg-[#15161a] p-0.5 rounded-lg border border-white/[0.06] text-xs">
            <button id="densityCompactBtn" class="p-1.5 rounded text-[#a1a1aa] hover:text-white transition-all" title="4 列紧凑网格">
              <i data-lucide="grid-3x3" class="w-3.5 h-3.5"></i>
            </button>
            <button id="densityStandardBtn" class="p-1.5 rounded bg-[#22252c] text-white transition-all" title="3 列标准网格">
              <i data-lucide="grid-2x2" class="w-3.5 h-3.5"></i>
            </button>
            <button id="densitySpaciousBtn" class="p-1.5 rounded text-[#a1a1aa] hover:text-white transition-all" title="2 列沉浸大图">
              <i data-lucide="rectangle-horizontal" class="w-3.5 h-3.5"></i>
            </button>
          </div>

          <!-- Filtered Count Badge -->
          <span id="filteredCountBadge" class="text-[11px] font-mono text-[#888990] bg-[#15161a] px-2 py-1 rounded-md border border-white/[0.05]">
            24 / 24 组
          </span>
        </div>

      </div>

    </div>
  </div>

  <!-- Main Exploration Stage (Full-Width Visual Canvas) -->
  <div class="max-w-[1720px] mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <main id="galleryView" class="space-y-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-5 transition-all" id="galleryGrid">
        <!-- Visual cards populated here -->
      </div>
    </main>
  </div>

  <!-- Lightbox Modal (Full-Screen Immersive Cinema & Prompt Bar) -->
  <div id="lightboxModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-xl flex flex-col justify-between p-3 sm:p-5 opacity-0 pointer-events-none transition-opacity duration-200" onclick="if(event.target===this) closeLightbox();">
    
    <!-- Top Floating Header Bar -->
    <div class="max-w-6xl w-full mx-auto flex items-center justify-between gap-3 z-20 shrink-0">
      <div class="flex items-center gap-2.5 bg-[#15161a]/90 backdrop-blur-md px-3.5 py-2 rounded-xl border border-white/[0.1] shadow-lg">
        <span id="lightboxNumber" class="px-2 py-0.5 rounded text-[11px] font-mono font-bold bg-[#22252c] text-[#e25c38] border border-white/[0.08]">#01</span>
        <span id="lightboxTitleCn" class="text-sm sm:text-base font-bold text-[#fbfbfa] font-serif-editorial">厚涂油画</span>
        <span class="text-white/20 hidden sm:inline">|</span>
        <span id="lightboxTitleEn" class="text-xs font-mono text-[#888990] hidden sm:inline">Impasto Oil Painting</span>
        <span id="lightboxCategory" class="text-[11px] font-mono text-[#e25c38] hidden md:inline px-2 py-0.5 rounded bg-[#e25c38]/10">传统画种</span>
      </div>

      <div class="flex items-center gap-2">
        <button id="closeLightboxBtn" class="p-2 rounded-xl bg-[#15161a]/90 hover:bg-[#22252c] text-[#a1a1aa] hover:text-white border border-white/[0.1] backdrop-blur-md transition-all shadow-lg" title="关闭 (Esc)">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Center: Large Fullscreen Artwork Viewport -->
    <div class="flex-1 w-full flex items-center justify-center p-2 sm:p-4 overflow-hidden relative min-h-0">
      <!-- Prev / Next Floating Navigation Buttons -->
      <button id="prevLightboxBtn" class="absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 z-20 p-3 rounded-full bg-[#15161a]/80 hover:bg-[#e25c38] text-[#a1a1aa] hover:text-white border border-white/[0.1] backdrop-blur-md transition-all shadow-2xl" title="上一张 (←)">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      <button id="nextLightboxBtn" class="absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 z-20 p-3 rounded-full bg-[#15161a]/80 hover:bg-[#e25c38] text-[#a1a1aa] hover:text-white border border-white/[0.1] backdrop-blur-md transition-all shadow-2xl" title="下一张 (→)">
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>

      <img id="lightboxImg" src="" alt="Artwork" class="max-h-[72vh] sm:max-h-[76vh] max-w-[94vw] object-contain rounded-xl shadow-[0_0_60px_rgba(0,0,0,0.95)] border border-white/[0.08] transition-all select-none">
    </div>

    <!-- Bottom: Floating Glass Prompt Bar -->
    <div class="max-w-4xl w-full mx-auto z-20 shrink-0">
      <div class="bg-[#15161a]/95 backdrop-blur-xl border border-white/[0.12] rounded-2xl p-3 sm:p-4 shadow-2xl space-y-2.5">
        <!-- Row 1: Prompt Text & Hero Copy Button -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-[10px] font-mono uppercase text-[#888990] tracking-wider flex items-center gap-1">
                <i data-lucide="sparkles" class="w-3 h-3 text-[#e25c38]"></i> 出图 Prompt 提示词
              </span>
            </div>
            <p id="lightboxPromptText" class="font-mono-code text-[11px] sm:text-xs text-[#e4e4e7] line-clamp-2 select-all leading-relaxed bg-[#0f1013] p-2.5 rounded-xl border border-white/[0.06]">
              Loading prompt...
            </p>
          </div>

          <button id="lightboxCopyBtn" class="px-4 py-3 rounded-xl bg-[#e25c38] hover:bg-[#c8502e] text-white font-medium flex items-center justify-center gap-2 text-xs shrink-0 shadow-lg shadow-[#e25c38]/30 transition-all">
            <i data-lucide="copy" class="w-4 h-4"></i>
            <span id="lightboxCopyBtnText">复制完整 Prompt</span>
          </button>
        </div>

        <!-- Row 2: Key Modifiers Chips -->
        <div class="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-white/[0.05]">
          <div class="flex flex-wrap items-center gap-1.5 min-w-0" id="lightboxModifiers">
            <!-- Rendered dynamically -->
          </div>
          <span class="text-[10px] font-mono text-[#5c5d64] hidden md:inline shrink-0">
            按 ← / → 切换 · Esc 退出
          </span>
        </div>
      </div>
    </div>

  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl bg-[#15161a] border border-white/[0.15] text-[#fbfbfa] text-xs font-medium shadow-2xl flex items-center gap-2.5 transform translate-y-20 opacity-0 transition-all duration-200 pointer-events-none">
    <i data-lucide="check" class="w-4 h-4 text-[#e25c38]"></i>
    <span id="toastMsg">提示词已成功复制到剪贴板</span>
  </div>

  <!-- App Logic Scripts -->
  <script src="data.js"></script>
  <script>
    // State
    let currentSceneId = 'scene_a';
    let currentCategory = 'all';
    let searchQuery = '';
    let currentGridDensity = 'compact'; // 'compact' | 'standard' | 'spacious'
    let activeLightboxIndex = 0;

    const SCENE_ICONS = {
      scene_a: '☕',
      scene_b: '🚋',
      scene_c: '🌳',
      scene_d: '📚',
      scene_e: '🛸',
      scene_f: '🪼',
      scene_g: '🍜',
      scene_h: '🏡',
      scene_i: '🐪'
    };

    // DOM Elements
    const sceneNavContainer = document.getElementById('sceneNavContainer');
    const categoryNavContainer = document.getElementById('categoryNavContainer');
    const galleryGrid = document.getElementById('galleryGrid');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const exportPromptsBtn = document.getElementById('exportPromptsBtn');
    const randomStyleBtn = document.getElementById('randomStyleBtn');
    const copyCoreSubjectBtn = document.getElementById('copyCoreSubjectBtn');
    const activeSceneSubjectPreview = document.getElementById('activeSceneSubjectPreview');

    // Density Buttons
    const densityCompactBtn = document.getElementById('densityCompactBtn');
    const densityStandardBtn = document.getElementById('densityStandardBtn');
    const densitySpaciousBtn = document.getElementById('densitySpaciousBtn');

    // Lightbox DOM
    const lightboxModal = document.getElementById('lightboxModal');
    const closeLightboxBtn = document.getElementById('closeLightboxBtn');
    const prevLightboxBtn = document.getElementById('prevLightboxBtn');
    const nextLightboxBtn = document.getElementById('nextLightboxBtn');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxNumber = document.getElementById('lightboxNumber');
    const lightboxCategory = document.getElementById('lightboxCategory');
    const lightboxTitleCn = document.getElementById('lightboxTitleCn');
    const lightboxTitleEn = document.getElementById('lightboxTitleEn');
    const lightboxPromptText = document.getElementById('lightboxPromptText');
    const lightboxCopyBtn = document.getElementById('lightboxCopyBtn');
    const lightboxCopyBtnText = document.getElementById('lightboxCopyBtnText');
    const lightboxModifiers = document.getElementById('lightboxModifiers');

    // Initialize
    function init() {
      renderSceneTabs();
      renderCategoryPills();
      updateSceneContext();
      renderGallery();
      initEventListeners();
      setGridDensity(currentGridDensity);
      lucide.createIcons();
    }

    // Render 9 Benchmark Scene Horizontal Pill Tabs (Without Roman Numerals)
    function renderSceneTabs() {
      sceneNavContainer.innerHTML = SCENES_DATA.map(scene => {
        const isActive = scene.id === currentSceneId;
        const icon = SCENE_ICONS[scene.id] || '🎨';
        const cleanTitle = scene.title.split('·')[1] ? scene.title.split('·')[1].trim() : scene.title;

        return `
          <button onclick="switchScene('${scene.id}')" 
            class="px-3 py-1.5 rounded-lg text-xs font-medium shrink-0 flex items-center gap-1.5 transition-all border ${
              isActive 
                ? 'bg-[#e25c38] text-white border-[#e25c38] shadow-md shadow-[#e25c38]/20 font-semibold' 
                : 'bg-[#15161a] hover:bg-[#1f2128] text-[#a1a1aa] hover:text-white border-white/[0.06]'
            }">
            <span>${icon}</span>
            <span class="font-serif-editorial">${cleanTitle}</span>
            <span class="text-[10px] font-mono opacity-70 ml-0.5">(${scene.aspectRatio})</span>
          </button>
        `;
      }).join('');
      lucide.createIcons();
    }

    // Render Streamlined Category Pills
    function renderCategoryPills() {
      const scene = SCENES_DATA.find(s => s.id === currentSceneId);
      const allCount = scene ? scene.styles.length : 24;

      categoryNavContainer.innerHTML = STYLE_CATEGORIES.map(cat => {
        const isActive = cat.id === currentCategory;
        const count = cat.id === 'all' 
          ? allCount 
          : (scene ? scene.styles.filter(s => s.category === cat.id).length : 0);

        return `
          <button onclick="setCategory('${cat.id}')" 
            class="px-2.5 py-1 rounded-md text-[11px] font-medium flex items-center gap-1.5 transition-all border shrink-0 ${
              isActive 
                ? 'bg-[#e25c38]/20 text-[#e25c38] border-[#e25c38]/40 font-semibold' 
                : 'bg-[#15161a] text-[#888990] hover:text-white border-white/[0.05] hover:border-white/[0.12]'
            }">
            <span>${cat.name}</span>
            <span class="text-[10px] font-mono opacity-75">(${count})</span>
          </button>
        `;
      }).join('');

      lucide.createIcons();
    }

    // Update Context (Active Scene & Count)
    function updateSceneContext() {
      const scene = SCENES_DATA.find(s => s.id === currentSceneId);
      if (!scene) return;

      if (activeSceneSubjectPreview) {
        activeSceneSubjectPreview.innerText = scene.coreSubject;
      }
      
      const filtered = getFilteredStyles();
      const filteredCountBadge = document.getElementById('filteredCountBadge');
      if (filteredCountBadge) {
        filteredCountBadge.innerText = `${filtered.length} / ${scene.styles.length} 组`;
      }
    }

    // Switch Scene
    function switchScene(sceneId) {
      currentSceneId = sceneId;
      renderSceneTabs();
      renderCategoryPills();
      updateSceneContext();
      renderGallery();
    }
    window.switchScene = switchScene;

    // Set Category
    function setCategory(catId) {
      currentCategory = catId;
      renderCategoryPills();
      updateSceneContext();
      renderGallery();
    }
    window.setCategory = setCategory;

    // Filter Logic
    function getFilteredStyles() {
      const scene = SCENES_DATA.find(s => s.id === currentSceneId);
      if (!scene) return [];

      return scene.styles.filter(item => {
        const matchesCategory = currentCategory === 'all' || item.category === currentCategory;
        const matchesSearch = !searchQuery || 
          item.nameCn.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.nameEn.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (item.master && item.master.toLowerCase().includes(searchQuery.toLowerCase())) ||
          item.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase())) ||
          (item.prompt && item.prompt.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchesCategory && matchesSearch;
      });
    }

    // Render Visual-First Gallery Cards
    function renderGallery() {
      const scene = SCENES_DATA.find(s => s.id === currentSceneId);
      const isLandscape = scene && scene.aspectRatio === '16:9';
      const aspectClass = isLandscape ? 'aspect-[16/9]' : 'aspect-[3/4]';

      const items = getFilteredStyles();
      if (items.length === 0) {
        galleryGrid.innerHTML = `
          <div class="col-span-full py-20 text-center text-[#888990] bg-[#15161a] rounded-2xl border border-white/[0.06]">
            <i data-lucide="search-x" class="w-10 h-10 mx-auto mb-3 opacity-40 text-[#e25c38]"></i>
            <p class="text-sm font-medium text-[#fbfbfa]">未找到匹配的艺术流派</p>
            <p class="text-xs text-[#888990] mt-1">请尝试调整搜索词，或切换分类</p>
            <button onclick="clearSearch()" class="mt-4 px-3 py-1.5 rounded-lg bg-[#22252c] text-xs text-[#c4c4c7] hover:text-white border border-white/[0.08]">
              清空搜索关键词
            </button>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      galleryGrid.innerHTML = items.map(item => {
        return `
          <div class="art-card flex flex-col justify-between group">
            <!-- Artwork Media Frame -->
            <div class="art-card-media ${aspectClass}" onclick="openLightbox('${item.id}')">
              <img src="${item.image}" alt="${item.nameCn}" loading="lazy">
              
              <!-- Top Badges Overlay -->
              <div class="absolute top-2.5 left-2.5 right-2.5 flex items-center justify-between pointer-events-none z-10">
                <span class="px-2 py-0.5 rounded-md text-[11px] font-mono font-bold bg-[#0f1013]/90 text-[#fbfbfa] border border-white/[0.12] backdrop-blur-md shadow-md">
                  #${item.number} ${item.nameCn}
                </span>
              </div>

              <!-- Hover Overlay with Prompt & Action -->
              <div class="art-card-hover-overlay">
                <div class="space-y-2">
                  <p class="font-mono-code text-[11px] text-[#e4e4e7] line-clamp-2 bg-[#0f1013]/95 p-2 rounded-lg border border-white/[0.1] leading-relaxed shadow-lg">
                    ${item.prompt}
                  </p>
                  <div class="flex items-center justify-between gap-2 pt-1">
                    <span class="text-[11px] font-medium text-white/90 flex items-center gap-1.5">
                      <i data-lucide="zoom-in" class="w-3.5 h-3.5 text-[#e25c38]"></i>
                      展开大图与解析
                    </span>
                    <button onclick="event.stopPropagation(); copyPrompt('${item.id}', this)" 
                      class="copy-pill-btn px-2.5 py-1 rounded-md flex items-center gap-1 text-[11px] font-mono shadow-md">
                      <i data-lucide="copy" class="w-3 h-3 text-[#e25c38]"></i>
                      <span>复制 Prompt</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Card Bottom Bar (Streamlined: English name & Instant Copy Button) -->
            <div class="px-3.5 py-2.5 bg-[#15161a] border-t border-white/[0.06] flex items-center justify-between gap-2">
              <div class="min-w-0 flex items-center gap-2">
                <span class="text-xs font-mono text-[#888990] truncate" title="${item.nameEn}">${item.nameEn}</span>
              </div>
              <button onclick="copyPrompt('${item.id}', this)" 
                class="text-[11px] font-mono text-[#a1a1aa] hover:text-[#e25c38] hover:bg-[#e25c38]/10 px-2 py-1 rounded transition-all flex items-center gap-1 shrink-0" title="复制提示词">
                <i data-lucide="copy" class="w-3 h-3"></i>
                <span>复制 Prompt</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    // Copy Prompt Function with Visual Button State
    function copyPrompt(styleId, btnEl) {
      const scene = SCENES_DATA.find(s => s.id === currentSceneId);
      if (!scene) return;
      const item = scene.styles.find(st => st.id === styleId);
      if (!item) return;

      navigator.clipboard.writeText(item.prompt).then(() => {
        if (btnEl) {
          const originalHtml = btnEl.innerHTML;
          btnEl.innerHTML = `<i data-lucide="check" class="w-3 h-3 text-[#e25c38]"></i><span class="text-[#e25c38]">已复制</span>`;
          lucide.createIcons();
          setTimeout(() => {
            btnEl.innerHTML = originalHtml;
            lucide.createIcons();
          }, 1800);
        }
        showToast(`已复制【${item.nameCn}】出图 Prompt`);
      }).catch(() => {
        showToast('复制失败，请手动选取');
      });
    }
    window.copyPrompt = copyPrompt;

    // Toast Notification
    function showToast(msg) {
      toastMsg.innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
      }, 2200);
    }

    // Clear search
    function clearSearch() {
      searchInput.value = '';
      searchQuery = '';
      clearSearchBtn.classList.add('hidden');
      renderGallery();
    }
    window.clearSearch = clearSearch;

    // Lightbox Logic
    function openLightbox(styleId) {
      const scene = SCENES_DATA.find(s => s.id === currentSceneId);
      if (!scene) return;
      const idx = scene.styles.findIndex(st => st.id === styleId);
      if (idx === -1) return;

      activeLightboxIndex = idx;
      updateLightboxContent();
      lightboxModal.classList.remove('opacity-0', 'pointer-events-none');
      document.body.style.overflow = 'hidden';
    }
    window.openLightbox = openLightbox;

    function updateLightboxContent() {
      const scene = SCENES_DATA.find(s => s.id === currentSceneId);
      if (!scene) return;
      const item = scene.styles[activeLightboxIndex];
      if (!item) return;

      lightboxImg.src = item.image || '';
      lightboxImg.alt = item.nameCn;
      lightboxNumber.innerText = `#${item.number}`;
      if (lightboxCategory) lightboxCategory.innerText = item.categoryName;
      lightboxTitleCn.innerText = item.nameCn;
      if (lightboxTitleEn) lightboxTitleEn.innerText = item.nameEn;
      lightboxPromptText.innerText = item.prompt;
      
      // Reset zoom state on change
      lightboxImg.classList.remove('scale-125', 'cursor-zoom-out');
      lightboxImg.classList.add('cursor-zoom-in');

      lightboxCopyBtn.onclick = () => {
        navigator.clipboard.writeText(item.prompt).then(() => {
          lightboxCopyBtnText.innerText = '已复制！';
          setTimeout(() => { lightboxCopyBtnText.innerText = '复制完整 Prompt'; }, 1800);
          showToast(`已复制【${item.nameCn}】出图 Prompt`);
        });
      };

      lightboxModifiers.innerHTML = (item.keyModifiers || []).map(mod => `
        <button onclick="navigator.clipboard.writeText('${mod}'); showToast('已复制关键词：${mod}');" 
          class="px-2 py-1 rounded-md bg-[#0f1013] hover:bg-[#e25c38]/15 hover:border-[#e25c38]/50 border border-white/[0.08] text-[#c4c4c7] hover:text-[#e25c38] font-mono-code text-[11px] transition-all" title="点击单独复制">
          ${mod}
        </button>
      `).join('');

      lucide.createIcons();
    }

    // Toggle Image Zoom on Click in Lightbox
    lightboxImg.onclick = (e) => {
      e.stopPropagation();
      const isZoomed = lightboxImg.classList.contains('scale-125');
      if (isZoomed) {
        lightboxImg.classList.remove('scale-125', 'cursor-zoom-out');
        lightboxImg.classList.add('cursor-zoom-in');
      } else {
        lightboxImg.classList.add('scale-125', 'cursor-zoom-out');
        lightboxImg.classList.remove('cursor-zoom-in');
      }
    };

    function closeLightbox() {
      lightboxModal.classList.add('opacity-0', 'pointer-events-none');
      document.body.style.overflow = '';
    }

    // Lightbox Nav
    prevLightboxBtn.onclick = () => {
      const scene = SCENES_DATA.find(s => s.id === currentSceneId);
      if (!scene) return;
      activeLightboxIndex = (activeLightboxIndex - 1 + scene.styles.length) % scene.styles.length;
      updateLightboxContent();
    };

    nextLightboxBtn.onclick = () => {
      const scene = SCENES_DATA.find(s => s.id === currentSceneId);
      if (!scene) return;
      activeLightboxIndex = (activeLightboxIndex + 1) % scene.styles.length;
      updateLightboxContent();
    };

    closeLightboxBtn.onclick = closeLightbox;

    // Set Grid Density
    function setGridDensity(density) {
      currentGridDensity = density;
      densityCompactBtn.className = density === 'compact' ? 'p-1.5 rounded bg-[#22252c] text-white transition-all' : 'p-1.5 rounded text-[#a1a1aa] hover:text-white transition-all';
      densityStandardBtn.className = density === 'standard' ? 'p-1.5 rounded bg-[#22252c] text-white transition-all' : 'p-1.5 rounded text-[#a1a1aa] hover:text-white transition-all';
      densitySpaciousBtn.className = density === 'spacious' ? 'p-1.5 rounded bg-[#22252c] text-white transition-all' : 'p-1.5 rounded text-[#a1a1aa] hover:text-white transition-all';

      if (density === 'compact') {
        galleryGrid.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4 transition-all';
      } else if (density === 'spacious') {
        galleryGrid.className = 'grid grid-cols-1 md:grid-cols-2 gap-6 transition-all';
      } else {
        galleryGrid.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-5 transition-all';
      }
    }

    // Event Listeners
    function initEventListeners() {
      // Search
      searchInput.oninput = (e) => {
        searchQuery = e.target.value.trim();
        clearSearchBtn.classList.toggle('hidden', searchQuery.length === 0);
        renderGallery();
      };
      clearSearchBtn.onclick = clearSearch;

      // Keyboard Shortcut '/' for search and Escape to close modal
      window.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput && lightboxModal.classList.contains('opacity-0')) {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === 'Escape' && !lightboxModal.classList.contains('opacity-0')) {
          closeLightbox();
        } else if (!lightboxModal.classList.contains('opacity-0')) {
          if (e.key === 'ArrowLeft') {
            prevLightboxBtn.click();
          } else if (e.key === 'ArrowRight') {
            nextLightboxBtn.click();
          }
        }
      });

      // Density Toggles
      densityCompactBtn.onclick = () => setGridDensity('compact');
      densityStandardBtn.onclick = () => setGridDensity('standard');
      densitySpaciousBtn.onclick = () => setGridDensity('spacious');

      // Random Style
      randomStyleBtn.onclick = () => {
        const scene = SCENES_DATA.find(s => s.id === currentSceneId);
        if (!scene) return;
        const randomItem = scene.styles[Math.floor(Math.random() * scene.styles.length)];
        openLightbox(randomItem.id);
        showToast(`灵感抽取：【${randomItem.nameCn}】`);
      };

      // Copy Core Subject
      copyCoreSubjectBtn.onclick = () => {
        const scene = SCENES_DATA.find(s => s.id === currentSceneId);
        if (!scene) return;
        navigator.clipboard.writeText(scene.coreSubject).then(() => {
          showToast('已复制基准场景主体 Prompt');
        });
      };

      // Export
      exportPromptsBtn.onclick = () => {
        const scene = SCENES_DATA.find(s => s.id === currentSceneId);
        if (!scene) return;
        const textData = scene.styles.map(st => `=== ${st.number}. ${st.nameCn} (${st.nameEn}) ===\nMaster: ${st.master}\nTechnique: ${st.technique}\nPrompt: ${st.prompt}\nTags: ${st.tags.join(', ')}\n`).join('\n\n');
        const blob = new Blob([textData], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${scene.id}_prompts.txt`;
        a.click();
        URL.revokeObjectURL(url);
        showToast(`已导出【${scene.title}】全部 Prompt 图谱`);
      };
    }

    // Run
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
