<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画风图谱 · 艺术与插画流派视觉图谱 | Art Style Archive</title>
  
  <!-- Analytics (Umami) -->
  <script
    defer
    src="https://cloud.umami.is/script.js"
    data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"
    data-domains="holynova.github.io"
    data-exclude-search="true"
    data-exclude-hash="true"
  ></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="selection:bg-[#e25c38] selection:text-white min-h-screen text-[#e4e4e7] overflow-x-hidden bg-[#090a0c]">

  <!-- Top Global Navigation Bar -->
  <header class="sticky top-0 z-40 w-full bg-[#090a0c]/95 backdrop-blur-md border-b border-white/[0.08] px-4 lg:px-8 py-2.5 sm:py-3">
    <div class="max-w-[1720px] mx-auto flex items-center justify-between gap-3 sm:gap-4">
      
      <!-- Brand -->
      <a href="#" class="flex items-center gap-2.5 shrink-0">
        <span id="brandTitleText" class="font-semibold text-base sm:text-lg tracking-tight text-white">画风图谱</span>
        <span id="brandSubText" class="text-xs text-[#71717a] font-mono hidden md:inline">Art Style Archive</span>
      </a>

      <!-- View Mode Segmented Toggle (By Scene / By Style) -->
      <div class="flex items-center p-0.5 sm:p-1 bg-[#141518] rounded-lg border border-white/[0.08] text-xs shrink-0">
        <button id="viewModeSceneBtn" onclick="setViewMode('scene')" 
          class="px-2.5 sm:px-3 py-1 sm:py-1.2 rounded-md font-medium transition-all bg-[#e25c38] text-white shadow-sm flex items-center gap-1.5">
          <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
          <span id="viewModeSceneText">按场景</span>
        </button>
        <button id="viewModeStyleBtn" onclick="setViewMode('style')" 
          class="px-2.5 sm:px-3 py-1 sm:py-1.2 rounded-md font-medium transition-all text-[#a1a1aa] hover:text-white flex items-center gap-1.5">
          <i data-lucide="palette" class="w-3.5 h-3.5"></i>
          <span id="viewModeStyleText">按风格</span>
        </button>
      </div>

      <!-- Global Search -->
      <div class="flex-1 max-w-xs sm:max-w-md mx-1 sm:mx-2">
        <div class="relative w-full">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-[#71717a]"></i>
          <input type="text" id="searchInput" placeholder="搜索画风、流派或 Prompt..." 
            class="w-full pl-8 pr-8 py-1.5 bg-[#141518] hover:bg-[#1a1c20] focus:bg-[#1a1c20] border border-white/[0.08] focus:border-[#e25c38] rounded-lg text-xs text-white placeholder-[#52525b] focus:outline-none transition-all">
          <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-[#71717a] hover:text-white">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button id="randomStyleBtn" class="px-2.5 py-1.5 rounded-lg bg-[#141518] hover:bg-[#202227] text-[#a1a1aa] hover:text-white border border-white/[0.08] text-xs font-medium transition-all flex items-center gap-1.5" title="随机抽取画风">
          <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
          <span id="randomBtnText" class="hidden sm:inline">随机</span>
        </button>

        <!-- Language Switcher -->
        <button id="langToggleBtn" onclick="toggleLanguage()" 
          class="px-2.5 py-1.5 rounded-lg bg-[#141518] hover:bg-[#202227] text-[#a1a1aa] hover:text-white border border-white/[0.08] text-xs font-mono font-medium transition-all flex items-center gap-1" title="Switch Language / 切换语言">
          <i data-lucide="globe" class="w-3.5 h-3.5 text-[#e25c38]"></i>
          <span id="langBtnText">EN</span>
        </button>

        <a href="https://github.com/holynova/art-style-showcase" target="_blank" rel="noopener noreferrer" 
           class="p-1.5 rounded-lg bg-[#141518] hover:bg-[#202227] text-[#a1a1aa] hover:text-white border border-white/[0.08] transition-all flex items-center justify-center" title="GitHub 仓库">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        </a>
      </div>

    </div>
  </header>

  <!-- Sticky Dynamic Navigation (Switches between Scene Tabs & Style Tabs) -->
  <div class="sticky top-[53px] z-30 w-full bg-[#090a0c]/90 backdrop-blur-md border-b border-white/[0.06] px-4 lg:px-8 py-2.5 transition-all">
    <div class="max-w-[1720px] mx-auto">
      
      <!-- Desktop: Clean Wrapped Segmented Buttons -->
      <div class="hidden sm:flex flex-wrap items-center gap-1.5" id="navTabsDesktop">
        <!-- Rendered dynamically -->
      </div>

      <!-- Mobile: Clean Native Dropdown -->
      <div class="sm:hidden relative">
        <select id="navSelectMobile" onchange="handleMobileNavChange(this.value)" 
          class="w-full bg-[#141518] text-white text-xs font-medium px-3.5 py-2 rounded-lg border border-white/[0.1] focus:outline-none focus:border-[#e25c38]">
          <!-- Populated dynamically -->
        </select>
      </div>

    </div>
  </div>

  <!-- Main Exploration Stage -->
  <main class="max-w-[1720px] mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="columns-2 md:columns-3 lg:columns-4 gap-4 sm:gap-5" id="galleryGrid">
      <!-- Visual cards populated here -->
    </div>
  </main>

  <!-- Lightbox Modal (Ultra Full-Screen Cinema with Edge-to-Edge Artwork & Floating Minimal Prompt Bar) -->
  <div id="lightboxModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex flex-col justify-between p-2 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-200" onclick="if(event.target===this) closeLightbox();">
    
    <!-- Top Floating Header Bar -->
    <div class="w-full max-w-7xl mx-auto flex items-center justify-between gap-3 z-30 shrink-0">
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[#141518]/90 border border-white/[0.1] text-xs backdrop-blur-md">
        <span id="lightboxNumber" class="font-mono text-[#e25c38] font-bold">#01</span>
        <span id="lightboxTitleCn" class="font-semibold text-white">厚涂油画</span>
        <span class="text-white/20">|</span>
        <span id="lightboxTitleEn" class="text-[#a1a1aa] font-mono">Impasto Oil Painting</span>
      </div>

      <!-- Comparative Model Switcher (Gemini vs ChatGPT) -->
      <div id="lightboxModelSwitch" class="hidden flex items-center gap-1 p-1 bg-[#141518]/90 rounded-lg border border-white/[0.1] text-xs font-mono backdrop-blur-md">
        <button id="modelBtnGemini" onclick="setLightboxModel('gemini')" class="px-2.5 py-1 rounded bg-[#e25c38] text-white font-medium flex items-center gap-1 transition-all">
          <span>✨ Gemini</span>
        </button>
        <button id="modelBtnChatgpt" onclick="setLightboxModel('chatgpt')" class="px-2.5 py-1 rounded text-[#a1a1aa] hover:text-white flex items-center gap-1 transition-all">
          <span>🤖 ChatGPT</span>
        </button>
      </div>

      <!-- Controls Right -->
      <div class="flex items-center gap-2">
        <button id="togglePromptBarBtn" onclick="togglePromptBar()" class="p-2 rounded-lg bg-[#141518]/90 hover:bg-[#202227] text-[#a1a1aa] hover:text-white border border-white/[0.1] transition-all" title="显示/隐藏 Prompt">
          <i data-lucide="message-square" class="w-4 h-4"></i>
        </button>
        <button id="closeLightboxBtn" class="p-2 rounded-lg bg-[#141518]/90 hover:bg-[#202227] text-[#a1a1aa] hover:text-white border border-white/[0.1] transition-all" title="关闭 (Esc)">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Center: True Edge-to-Edge Fullscreen Artwork Viewport -->
    <div class="flex-1 w-full flex items-center justify-center p-1 sm:p-2 overflow-hidden relative min-h-0">
      <!-- Prev / Next Floating Navigation Buttons -->
      <button id="prevLightboxBtn" class="absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 z-30 p-3 rounded-full bg-[#141518]/80 hover:bg-[#e25c38] text-[#a1a1aa] hover:text-white border border-white/[0.1] backdrop-blur-md transition-all shadow-2xl" title="上一张 (←)">
        <i data-lucide="chevron-left" class="w-6 h-6"></i>
      </button>
      <button id="nextLightboxBtn" class="absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 z-30 p-3 rounded-full bg-[#141518]/80 hover:bg-[#e25c38] text-[#a1a1aa] hover:text-white border border-white/[0.1] backdrop-blur-md transition-all shadow-2xl" title="下一张 (→)">
        <i data-lucide="chevron-right" class="w-6 h-6"></i>
      </button>

      <!-- Artwork Viewport Container with Smooth Dual-Layer Crossfade & Zoom -->
      <div id="lightboxViewport" class="relative w-full h-full max-h-[88vh] sm:max-h-[92vh] max-w-[96vw] flex items-center justify-center cursor-zoom-in transition-transform duration-300 ease-out select-none">
        <!-- Low-res thumbnail layer (Immediate placeholder) -->
        <img id="lightboxThumbImg" src="" alt="Thumbnail" class="max-h-[88vh] sm:max-h-[92vh] max-w-[96vw] w-auto h-auto object-contain rounded-xl shadow-[0_20px_50px_rgba(0,0,0,0.8)] border border-white/[0.08] select-none transition-opacity duration-300">
        
        <!-- High-res full image layer (Fades in seamlessly over thumbnail with zero jump) -->
        <img id="lightboxImg" src="" alt="Artwork" class="absolute inset-0 m-auto max-h-[88vh] sm:max-h-[92vh] max-w-[96vw] w-auto h-auto object-contain rounded-xl select-none opacity-0 transition-opacity duration-400">
      </div>
    </div>

    <!-- Floating Minimal Frosted Glass Prompt Card at Bottom -->
    <div id="lightboxPromptBar" class="absolute bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 max-w-4xl w-[92vw] z-30 transition-all duration-200">
      <div class="bg-[#141518]/90 backdrop-blur-xl border border-white/[0.12] rounded-xl p-3 sm:p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-[0_15px_40px_rgba(0,0,0,0.8)]">
        <p id="lightboxPromptText" class="font-mono text-xs text-[#e4e4e7] line-clamp-2 select-all leading-relaxed flex-1">
          Loading prompt...
        </p>
        <button id="lightboxCopyBtn" class="px-4 py-2 rounded-lg bg-[#e25c38] hover:bg-[#c8502e] text-white font-medium flex items-center justify-center gap-1.5 text-xs shrink-0 transition-all shadow-md">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i>
          <span id="lightboxCopyBtnText">复制 Prompt</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-lg bg-[#141518] border border-white/[0.15] text-[#fbfbfa] text-xs font-medium shadow-2xl flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-200 pointer-events-none">
    <i data-lucide="check" class="w-4 h-4 text-[#e25c38]"></i>
    <span id="toastMsg">提示词已成功复制到剪贴板</span>
  </div>

  <!-- App Logic Scripts -->
  <script src="data.js"></script>
  <script>
    // Bilingual Internationalization Dictionary
    const I18N = {
      zh: {
        siteTitle: "画风图谱 · 艺术与插画流派视觉图谱 | Art Style Archive",
        brandTitle: "画风图谱",
        brandSub: "Art Style Archive",
        viewModeScene: "按场景",
        viewModeStyle: "按风格",
        searchPlaceholder: "搜索画风、场景、流派或 Prompt...",
        randomBtn: "随机",
        langBtn: "EN",
        langTitle: "切换为英文 / Switch to English",
        copyPrompt: "复制",
        copyPromptBtn: "复制 Prompt",
        copied: "已复制！",
        copiedToast: (name) => `已复制【${name}】出图 Prompt`,
        copyFailed: "复制失败，请手动选取",
        randomToast: (name) => `随机抽取：【${name}】`,
        noMatchTitle: "未找到匹配作品",
        noMatchSub: "请尝试其他关键词",
        clearSearch: "清空搜索",
        closeTitle: "关闭 (Esc)",
        prevTitle: "上一张 (←)",
        nextTitle: "下一张 (→)",
        scenes: {
          scene_a: "咖啡馆雨窗与猫",
          scene_b: "雨后黄昏海滨电车",
          scene_c: "悬崖古树与镜湖",
          scene_d: "午夜古书店与老学者",
          scene_e: "云海机械飞艇与悬空港",
          scene_f: "深海发光水母与探险潜水员",
          scene_g: "赛博雨夜拉面馆与机械少女",
          scene_h: "森林深处的魔导树屋与炼金女巫",
          scene_i: "荒漠废墟与流浪机械驼兽"
        }
      },
      en: {
        siteTitle: "Art Style Archive · 41 Art Styles Benchmark Matrix",
        brandTitle: "Art Style Archive",
        brandSub: "Visual Matrix",
        viewModeScene: "By Scene",
        viewModeStyle: "By Style",
        searchPlaceholder: "Search styles, scenes, masters, or keywords...",
        randomBtn: "Random",
        langBtn: "中文",
        langTitle: "切换为中文 / Switch to Chinese",
        copyPrompt: "Copy",
        copyPromptBtn: "Copy Prompt",
        copied: "Copied!",
        copiedToast: (name) => `Copied prompt for [${name}]`,
        copyFailed: "Copy failed, please select manually",
        randomToast: (name) => `Random pick: [${name}]`,
        noMatchTitle: "No matching artworks found",
        noMatchSub: "Try searching with different keywords",
        clearSearch: "Clear Search",
        closeTitle: "Close (Esc)",
        prevTitle: "Previous (←)",
        nextTitle: "Next (→)",
        scenes: {
          scene_a: "Rainy Cafe & Cat",
          scene_b: "Seaside Tram at Dusk",
          scene_c: "Cliff Tree & Mirror Lake",
          scene_d: "Midnight Bookstore & Scholar",
          scene_e: "Airship & Floating Skyport",
          scene_f: "Bioluminescent Jellyfish & Diver",
          scene_g: "Cyberpunk Ramen & Cyborg Girl",
          scene_h: "Treehouse & Alchemist Witch",
          scene_i: "Desert Ruins & Mecha Camel"
        }
      }
    };

    // State
    let currentLang = localStorage.getItem("art_style_lang") || 
      (typeof navigator !== "undefined" && navigator.language && navigator.language.startsWith("zh") ? "zh" : "en");
    let viewMode = "scene"; // "scene" or "style"
    let currentSceneId = "scene_a";
    let currentStyleNumber = "01";
    let currentLightboxModel = "gemini"; // "gemini" or "chatgpt"
    let isPromptBarVisible = true;
    let searchQuery = "";
    let activeLightboxIndex = 0;

    // DOM Elements
    const brandTitleText = document.getElementById("brandTitleText");
    const brandSubText = document.getElementById("brandSubText");
    const viewModeSceneBtn = document.getElementById("viewModeSceneBtn");
    const viewModeStyleBtn = document.getElementById("viewModeStyleBtn");
    const viewModeSceneText = document.getElementById("viewModeSceneText");
    const viewModeStyleText = document.getElementById("viewModeStyleText");
    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const randomStyleBtn = document.getElementById("randomStyleBtn");
    const randomBtnText = document.getElementById("randomBtnText");
    const langToggleBtn = document.getElementById("langToggleBtn");
    const langBtnText = document.getElementById("langBtnText");
    const navTabsDesktop = document.getElementById("navTabsDesktop");
    const navSelectMobile = document.getElementById("navSelectMobile");
    const galleryGrid = document.getElementById("galleryGrid");
    const toast = document.getElementById("toast");
    const toastMsg = document.getElementById("toastMsg");

    // Lightbox DOM
    const lightboxModal = document.getElementById("lightboxModal");
    const closeLightboxBtn = document.getElementById("closeLightboxBtn");
    const prevLightboxBtn = document.getElementById("prevLightboxBtn");
    const nextLightboxBtn = document.getElementById("nextLightboxBtn");
    const lightboxViewport = document.getElementById("lightboxViewport");
    const lightboxThumbImg = document.getElementById("lightboxThumbImg");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxNumber = document.getElementById("lightboxNumber");
    const lightboxTitleCn = document.getElementById("lightboxTitleCn");
    const lightboxTitleEn = document.getElementById("lightboxTitleEn");
    const lightboxPromptText = document.getElementById("lightboxPromptText");
    const lightboxPromptBar = document.getElementById("lightboxPromptBar");
    const lightboxCopyBtn = document.getElementById("lightboxCopyBtn");
    const lightboxCopyBtnText = document.getElementById("lightboxCopyBtnText");
    const lightboxModelSwitch = document.getElementById("lightboxModelSwitch");
    const modelBtnGemini = document.getElementById("modelBtnGemini");
    const modelBtnChatgpt = document.getElementById("modelBtnChatgpt");

    // Initialize
    function init() {
      applyLanguage(currentLang);
      initEventListeners();
      lucide.createIcons();
    }

    // Set View Mode (Scene vs Style)
    function setViewMode(mode) {
      viewMode = mode;
      viewModeSceneBtn.classList.toggle("bg-[#e25c38]", mode === "scene");
      viewModeSceneBtn.classList.toggle("text-white", mode === "scene");
      viewModeSceneBtn.classList.toggle("text-[#a1a1aa]", mode !== "scene");

      viewModeStyleBtn.classList.toggle("bg-[#e25c38]", mode === "style");
      viewModeStyleBtn.classList.toggle("text-white", mode === "style");
      viewModeStyleBtn.classList.toggle("text-[#a1a1aa]", mode !== "style");

      renderNavTabs();
      renderGallery();
    }
    window.setViewMode = setViewMode;

    // Language Handling
    function applyLanguage(lang) {
      currentLang = lang;
      try { localStorage.setItem("art_style_lang", lang); } catch (e) {}
      const t = I18N[lang];

      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = t.siteTitle;

      if (brandTitleText) brandTitleText.innerText = t.brandTitle;
      if (brandSubText) brandSubText.innerText = t.brandSub;
      if (viewModeSceneText) viewModeSceneText.innerText = t.viewModeScene;
      if (viewModeStyleText) viewModeStyleText.innerText = t.viewModeStyle;
      if (searchInput) searchInput.placeholder = t.searchPlaceholder;
      if (randomBtnText) randomBtnText.innerText = t.randomBtn;
      if (langBtnText) langBtnText.innerText = t.langBtn;
      if (langToggleBtn) langToggleBtn.title = t.langTitle;
      if (closeLightboxBtn) closeLightboxBtn.title = t.closeTitle;
      if (prevLightboxBtn) prevLightboxBtn.title = t.prevTitle;
      if (nextLightboxBtn) nextLightboxBtn.title = t.nextTitle;
      if (lightboxCopyBtnText) lightboxCopyBtnText.innerText = t.copyPromptBtn;

      renderNavTabs();
      renderGallery();
      if (lightboxModal && !lightboxModal.classList.contains("opacity-0")) {
        updateLightboxContent();
      }
    }

    function toggleLanguage() {
      applyLanguage(currentLang === "zh" ? "en" : "zh");
    }
    window.toggleLanguage = toggleLanguage;

    function getSceneTitle(sceneId) {
      const t = I18N[currentLang];
      if (t.scenes && t.scenes[sceneId]) {
        return t.scenes[sceneId];
      }
      const scene = SCENES_DATA.find(s => s.id === sceneId);
      return scene ? (scene.title.split("·")[1] ? scene.title.split("·")[1].trim() : scene.title) : sceneId;
    }

    // Render Navigation Controls (Scene Tabs or Style Tabs)
    function renderNavTabs() {
      if (viewMode === "scene") {
        navTabsDesktop.innerHTML = SCENES_DATA.map(scene => {
          const isActive = scene.id === currentSceneId;
          const sceneTitle = getSceneTitle(scene.id);

          return `
            <button onclick="switchScene('${scene.id}')" 
              class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all border shrink-0 ${
                isActive 
                  ? "bg-[#e25c38] text-white border-[#e25c38] shadow-sm font-semibold" 
                  : "bg-[#141518] hover:bg-[#202227] text-[#a1a1aa] hover:text-white border-white/[0.08]"
              }">
              <span>${sceneTitle}</span>
            </button>
          `;
        }).join("");

        navSelectMobile.innerHTML = SCENES_DATA.map(scene => {
          const sceneTitle = getSceneTitle(scene.id);
          return `<option value="${scene.id}" ${scene.id === currentSceneId ? "selected" : ""}>${sceneTitle}</option>`;
        }).join("");
      } else {
        // By Style mode
        const firstScene = SCENES_DATA[0];
        const allStyles = firstScene ? firstScene.styles : [];

        navTabsDesktop.innerHTML = allStyles.map(style => {
          const isActive = style.number === currentStyleNumber;
          const primaryTitle = currentLang === "zh" ? style.nameCn : style.nameEn;

          return `
            <button onclick="switchStyle('${style.number}')" 
              class="px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all border shrink-0 flex items-center gap-1.5 ${
                isActive 
                  ? "bg-[#e25c38] text-white border-[#e25c38] shadow-sm font-semibold" 
                  : "bg-[#141518] hover:bg-[#202227] text-[#a1a1aa] hover:text-white border-white/[0.08]"
              }">
              <span class="font-mono text-[10px] opacity-75">#${style.number}</span>
              <span>${primaryTitle}</span>
            </button>
          `;
        }).join("");

        navSelectMobile.innerHTML = allStyles.map(style => {
          const primaryTitle = currentLang === "zh" ? style.nameCn : style.nameEn;
          return `<option value="${style.number}" ${style.number === currentStyleNumber ? "selected" : ""}>#${style.number} ${primaryTitle}</option>`;
        }).join("");
      }

      lucide.createIcons();
    }

    function handleMobileNavChange(val) {
      if (viewMode === "scene") {
        switchScene(val);
      } else {
        switchStyle(val);
      }
    }
    window.handleMobileNavChange = handleMobileNavChange;

    function switchScene(sceneId) {
      currentSceneId = sceneId;
      renderNavTabs();
      renderGallery();
    }
    window.switchScene = switchScene;

    function switchStyle(styleNum) {
      currentStyleNumber = styleNum;
      renderNavTabs();
      renderGallery();
    }
    window.switchStyle = switchStyle;

    // Filter Logic
    function getActiveDataset() {
      if (viewMode === "scene") {
        const scene = SCENES_DATA.find(s => s.id === currentSceneId);
        if (!scene) return [];
        return scene.styles.map(st => ({
          ...st,
          sceneId: scene.id,
          aspectRatio: scene.aspectRatio,
          displayHeading: currentLang === "zh" ? st.nameCn : st.nameEn,
          displaySubheading: currentLang === "zh" ? st.nameEn : st.nameCn
        }));
      } else {
        // Collect all 9 scenes for currentStyleNumber
        const list = [];
        for (const scene of SCENES_DATA) {
          const st = scene.styles.find(s => s.number === currentStyleNumber);
          if (st) {
            const sceneTitle = getSceneTitle(scene.id);
            const styleTitle = currentLang === "zh" ? st.nameCn : st.nameEn;
            list.push({
              ...st,
              sceneId: scene.id,
              aspectRatio: scene.aspectRatio,
              displayHeading: sceneTitle,
              displaySubheading: styleTitle
            });
          }
        }
        return list;
      }
    }

    function getFilteredItems() {
      const items = getActiveDataset();
      if (!searchQuery) return items;

      return items.filter(item => {
        return item.nameCn.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.nameEn.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (item.master && item.master.toLowerCase().includes(searchQuery.toLowerCase())) ||
          (item.tags && item.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()))) ||
          (item.prompt && item.prompt.toLowerCase().includes(searchQuery.toLowerCase())) ||
          (getSceneTitle(item.sceneId).toLowerCase().includes(searchQuery.toLowerCase()));
      });
    }

    // Render Gallery Cards
    function renderGallery() {
      const t = I18N[currentLang];
      const items = getFilteredItems();

      if (items.length === 0) {
        galleryGrid.innerHTML = `
          <div class="w-full [column-span:_all] py-20 text-center text-[#71717a] bg-[#141518] rounded-xl border border-white/[0.06]">
            <i data-lucide="search-x" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
            <p class="text-sm font-medium text-white">${t.noMatchTitle}</p>
            <p class="text-xs text-[#71717a] mt-1">${t.noMatchSub}</p>
            <button onclick="clearSearch()" class="mt-4 px-3 py-1.5 rounded-lg bg-[#202227] text-xs text-[#a1a1aa] hover:text-white border border-white/[0.08]">
              ${t.clearSearch}
            </button>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      galleryGrid.innerHTML = items.map((item, index) => {
        const thumbSrc = item.image.replace("images/", "images/thumbs/");
        const aspectClass = item.aspectRatio === "16:9" ? "aspect-[16/9]" : "aspect-[3/4]";
        const hasChatgpt = Boolean(item.chatgptImage);

        return `
          <div class="art-card break-inside-avoid mb-4 sm:mb-5 w-full inline-block group">
            <div class="art-card-media ${aspectClass}" onclick="openLightboxByIndex(${index})">
              <img src="${thumbSrc}" alt="${item.displayHeading}" loading="lazy" decoding="async" 
                   class="opacity-0 transition-opacity duration-300" onload="this.classList.remove('opacity-0')">
              
              <!-- Badges on top -->
              <div class="absolute top-2.5 left-2.5 z-10 flex items-center gap-1.5 pointer-events-none">
                <span class="px-2 py-0.5 rounded text-[11px] font-mono font-medium bg-[#090a0c]/85 text-[#f4f4f5] border border-white/[0.1] backdrop-blur-md">
                  #${item.number}
                </span>
                ${hasChatgpt ? `
                  <span class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-[#8b5cf6]/20 text-[#c4b5fd] border border-[#8b5cf6]/30 backdrop-blur-md">
                    ✨+🤖
                  </span>
                ` : ""}
              </div>

              <!-- Floating Bottom Info on Image (Hover only for copy button) -->
              <div class="absolute inset-x-0 bottom-0 p-2.5 sm:p-3 bg-gradient-to-t from-black/95 via-black/60 to-transparent flex items-end justify-between gap-2 z-10">
                <div class="min-w-0 flex-1">
                  <div class="text-xs sm:text-sm font-semibold text-white truncate">${item.displayHeading}</div>
                  <div class="text-[10px] font-mono text-[#a1a1aa] truncate">${item.displaySubheading}</div>
                </div>
                <button onclick="event.stopPropagation(); copyPromptByItem(this, ${index})" 
                  class="opacity-0 group-hover:opacity-100 px-2 py-1 rounded bg-white/15 hover:bg-[#e25c38] text-white border border-white/20 text-[11px] font-mono flex items-center gap-1 transition-opacity duration-150 shrink-0 backdrop-blur-md shadow-md" title="${t.copyPrompt}">
                  <i data-lucide="copy" class="w-3 h-3"></i>
                  <span class="hidden sm:inline">${t.copyPrompt}</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");
      lucide.createIcons();
    }

    // Copy Prompt
    function copyPromptByItem(btnEl, index) {
      const t = I18N[currentLang];
      const items = getFilteredItems();
      const item = items[index];
      if (!item) return;

      navigator.clipboard.writeText(item.prompt).then(() => {
        if (btnEl) {
          const originalHtml = btnEl.innerHTML;
          btnEl.innerHTML = `<i data-lucide="check" class="w-3 h-3 text-[#e25c38]"></i><span class="text-[#e25c38]">${t.copied}</span>`;
          lucide.createIcons();
          setTimeout(() => {
            btnEl.innerHTML = originalHtml;
            lucide.createIcons();
          }, 1600);
        }
        showToast(t.copiedToast(item.displayHeading));
      }).catch(() => {
        showToast(t.copyFailed);
      });
    }
    window.copyPromptByItem = copyPromptByItem;

    // Toast Notification
    function showToast(msg) {
      toastMsg.innerText = msg;
      toast.classList.remove("translate-y-20", "opacity-0", "pointer-events-none");
      setTimeout(() => {
        toast.classList.add("translate-y-20", "opacity-0", "pointer-events-none");
      }, 2000);
    }

    // Clear search
    function clearSearch() {
      searchInput.value = "";
      searchQuery = "";
      clearSearchBtn.classList.add("hidden");
      renderGallery();
    }
    window.clearSearch = clearSearch;

    // Lightbox Logic
    function openLightboxByIndex(index) {
      activeLightboxIndex = index;
      currentLightboxModel = "gemini";
      updateLightboxContent();
      lightboxModal.classList.remove("opacity-0", "pointer-events-none");
      document.body.style.overflow = "hidden";
    }
    window.openLightboxByIndex = openLightboxByIndex;

    function openLightbox(styleId) {
      const items = getFilteredItems();
      const idx = items.findIndex(st => st.id === styleId);
      if (idx !== -1) {
        openLightboxByIndex(idx);
      } else {
        // Find in full SCENES_DATA
        for (const scene of SCENES_DATA) {
          const found = scene.styles.find(st => st.id === styleId);
          if (found) {
            currentSceneId = scene.id;
            viewMode = "scene";
            renderNavTabs();
            renderGallery();
            const newItems = getFilteredItems();
            const newIdx = newItems.findIndex(st => st.id === styleId);
            if (newIdx !== -1) openLightboxByIndex(newIdx);
            break;
          }
        }
      }
    }
    window.openLightbox = openLightbox;

    function setLightboxModel(model) {
      currentLightboxModel = model;
      modelBtnGemini.classList.toggle("bg-[#e25c38]", model === "gemini");
      modelBtnGemini.classList.toggle("text-white", model === "gemini");
      modelBtnGemini.classList.toggle("text-[#a1a1aa]", model !== "gemini");

      modelBtnChatgpt.classList.toggle("bg-[#e25c38]", model === "chatgpt");
      modelBtnChatgpt.classList.toggle("text-white", model === "chatgpt");
      modelBtnChatgpt.classList.toggle("text-[#a1a1aa]", model !== "chatgpt");

      updateLightboxContent(false);
    }
    window.setLightboxModel = setLightboxModel;

    function togglePromptBar() {
      isPromptBarVisible = !isPromptBarVisible;
      lightboxPromptBar.classList.toggle("hidden", !isPromptBarVisible);
    }
    window.togglePromptBar = togglePromptBar;

    function updateLightboxContent(resetModel = true) {
      const t = I18N[currentLang];
      const items = getFilteredItems();
      if (!items || items.length === 0) return;
      if (activeLightboxIndex < 0) activeLightboxIndex = 0;
      if (activeLightboxIndex >= items.length) activeLightboxIndex = items.length - 1;

      const item = items[activeLightboxIndex];
      if (!item) return;

      if (resetModel) {
        currentLightboxModel = "gemini";
      }

      // Handle comparative models (Gemini vs ChatGPT)
      const hasChatgpt = Boolean(item.chatgptImage);
      lightboxModelSwitch.classList.toggle("hidden", !hasChatgpt);
      if (hasChatgpt) {
        modelBtnGemini.classList.toggle("bg-[#e25c38]", currentLightboxModel === "gemini");
        modelBtnGemini.classList.toggle("text-white", currentLightboxModel === "gemini");
        modelBtnGemini.classList.toggle("text-[#a1a1aa]", currentLightboxModel !== "gemini");

        modelBtnChatgpt.classList.toggle("bg-[#e25c38]", currentLightboxModel === "chatgpt");
        modelBtnChatgpt.classList.toggle("text-white", currentLightboxModel === "chatgpt");
        modelBtnChatgpt.classList.toggle("text-[#a1a1aa]", currentLightboxModel !== "chatgpt");
      }

      const activeImageSrc = (hasChatgpt && currentLightboxModel === "chatgpt") ? item.chatgptImage : item.image;
      const activeThumbSrc = (hasChatgpt && currentLightboxModel === "chatgpt") ? item.chatgptThumb : item.image.replace("images/", "images/thumbs/");

      const sceneTitle = getSceneTitle(item.sceneId);
      const styleTitleCn = item.nameCn;
      const styleTitleEn = item.nameEn;

      // Reset viewport zoom
      lightboxViewport.classList.remove("scale-150", "cursor-zoom-out");
      lightboxViewport.classList.add("cursor-zoom-in");

      // Set thumbnail immediately (fast placeholder)
      lightboxThumbImg.src = activeThumbSrc;
      lightboxThumbImg.alt = `${styleTitleCn} - ${sceneTitle}`;

      // Prepare high-res layer
      lightboxImg.classList.add("opacity-0");
      lightboxImg.src = "";

      // Preload full resolution image and crossfade in smoothly with zero jump
      const highRes = new Image();
      highRes.src = activeImageSrc;
      highRes.onload = () => {
        const currentItem = getFilteredItems()[activeLightboxIndex];
        if (currentItem && currentItem.id === item.id) {
          lightboxImg.src = activeImageSrc;
          lightboxImg.alt = `${styleTitleCn} - ${sceneTitle}`;
          requestAnimationFrame(() => {
            lightboxImg.classList.remove("opacity-0");
          });
        }
      };

      lightboxNumber.innerText = `#${item.number}`;
      lightboxTitleCn.innerText = viewMode === "scene" ? styleTitleCn : `${sceneTitle} · ${styleTitleCn}`;
      if (lightboxTitleEn) lightboxTitleEn.innerText = viewMode === "scene" ? styleTitleEn : `${item.aspectRatio}`;
      lightboxPromptText.innerText = item.prompt;
      lightboxCopyBtnText.innerText = t.copyPromptBtn;

      lightboxCopyBtn.onclick = () => {
        navigator.clipboard.writeText(item.prompt).then(() => {
          lightboxCopyBtnText.innerText = t.copied;
          setTimeout(() => { lightboxCopyBtnText.innerText = t.copyPromptBtn; }, 1600);
          showToast(t.copiedToast(item.displayHeading));
        });
      };

      lucide.createIcons();
    }

    // Toggle Image Zoom on Click in Lightbox
    lightboxViewport.onclick = (e) => {
      e.stopPropagation();
      const isZoomed = lightboxViewport.classList.contains("scale-150");
      if (isZoomed) {
        lightboxViewport.classList.remove("scale-150", "cursor-zoom-out");
        lightboxViewport.classList.add("cursor-zoom-in");
      } else {
        lightboxViewport.classList.add("scale-150", "cursor-zoom-out");
        lightboxViewport.classList.remove("cursor-zoom-in");
      }
    };

    function closeLightbox() {
      lightboxModal.classList.add("opacity-0", "pointer-events-none");
      document.body.style.overflow = "";
    }

    // Lightbox Nav
    prevLightboxBtn.onclick = () => {
      const items = getFilteredItems();
      if (!items || items.length === 0) return;
      activeLightboxIndex = (activeLightboxIndex - 1 + items.length) % items.length;
      updateLightboxContent();
    };

    nextLightboxBtn.onclick = () => {
      const items = getFilteredItems();
      if (!items || items.length === 0) return;
      activeLightboxIndex = (activeLightboxIndex + 1) % items.length;
      updateLightboxContent();
    };

    closeLightboxBtn.onclick = closeLightbox;

    // Event Listeners
    function initEventListeners() {
      // Search
      searchInput.oninput = (e) => {
        searchQuery = e.target.value.trim();
        clearSearchBtn.classList.toggle("hidden", searchQuery.length === 0);
        renderGallery();
      };
      clearSearchBtn.onclick = clearSearch;

      // Keyboard Shortcut "/" for search and Escape to close modal
      window.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement !== searchInput && lightboxModal.classList.contains("opacity-0")) {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === "Escape" && !lightboxModal.classList.contains("opacity-0")) {
          closeLightbox();
        } else if (!lightboxModal.classList.contains("opacity-0")) {
          if (e.key === "ArrowLeft") {
            prevLightboxBtn.click();
          } else if (e.key === "ArrowRight") {
            nextLightboxBtn.click();
          }
        }
      });

      // Random Style
      randomStyleBtn.onclick = () => {
        const t = I18N[currentLang];
        const items = getFilteredItems();
        if (!items || items.length === 0) return;
        const randomIdx = Math.floor(Math.random() * items.length);
        openLightboxByIndex(randomIdx);
        const randomItem = items[randomIdx];
        showToast(t.randomToast(randomItem.displayHeading));
      };
    }

    // Run
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
