<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画风图谱 · 艺术与插画流派视觉图谱 | Art Style Archive</title>
  
  <!-- Analytics (Umami) -->
  <script
    defer
    src="https://cloud.umami.is/script.js"
    data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"
    data-domains="holynova.github.io"
    data-exclude-search="true"
    data-exclude-hash="true"
  ></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="selection:bg-[#e25c38] selection:text-white min-h-screen text-[#e4e4e7] overflow-x-hidden bg-[#090a0c]">

  <!-- Top Global Navigation Bar -->
  <header class="sticky top-0 z-40 w-full bg-[#090a0c]/95 backdrop-blur-md border-b border-white/[0.08] px-4 lg:px-8 py-3">
    <div class="max-w-[1720px] mx-auto flex items-center justify-between gap-4">
      
      <!-- Brand -->
      <a href="#" class="flex items-center gap-2.5 shrink-0">
        <span class="font-semibold text-base sm:text-lg tracking-tight text-white">画风图谱</span>
        <span class="text-xs text-[#71717a] font-mono hidden sm:inline">Art Style Archive</span>
      </a>

      <!-- Global Search -->
      <div class="flex-1 max-w-md mx-2">
        <div class="relative w-full">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-[#71717a]"></i>
          <input type="text" id="searchInput" placeholder="搜索画风、流派或 Prompt..." 
            class="w-full pl-8 pr-8 py-1.5 bg-[#141518] hover:bg-[#1a1c20] focus:bg-[#1a1c20] border border-white/[0.08] focus:border-[#e25c38] rounded-lg text-xs text-white placeholder-[#52525b] focus:outline-none transition-all">
          <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-[#71717a] hover:text-white">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2 shrink-0">
        <button id="randomStyleBtn" class="px-2.5 py-1.5 rounded-lg bg-[#141518] hover:bg-[#202227] text-[#a1a1aa] hover:text-white border border-white/[0.08] text-xs font-medium transition-all flex items-center gap-1.5" title="随机抽取画风">
          <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">随机</span>
        </button>

        <a href="https://github.com/holynova/art-style-showcase" target="_blank" rel="noopener noreferrer" 
           class="p-1.5 rounded-lg bg-[#141518] hover:bg-[#202227] text-[#a1a1aa] hover:text-white border border-white/[0.08] transition-all flex items-center justify-center" title="GitHub 仓库">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        </a>
      </div>

    </div>
  </header>

  <!-- Sticky Scene Navigation (Clean Wrap Bar on Desktop, Clean Select on Mobile) -->
  <div class="sticky top-[53px] z-30 w-full bg-[#090a0c]/90 backdrop-blur-md border-b border-white/[0.06] px-4 lg:px-8 py-2.5 transition-all">
    <div class="max-w-[1720px] mx-auto">
      
      <!-- Desktop: Clean Wrapped Segmented Buttons (All 9 visible in 1-2 lines, NO emojis, NO roman numerals) -->
      <div class="hidden sm:flex flex-wrap items-center gap-1.5" id="sceneTabsDesktop">
        <!-- Rendered dynamically -->
      </div>

      <!-- Mobile: Clean Native Dropdown -->
      <div class="sm:hidden relative">
        <select id="sceneSelectMobile" onchange="switchScene(this.value)" 
          class="w-full bg-[#141518] text-white text-xs font-medium px-3.5 py-2 rounded-lg border border-white/[0.1] focus:outline-none focus:border-[#e25c38]">
          <!-- Populated dynamically -->
        </select>
      </div>

    </div>
  </div>

  <!-- Main Exploration Stage -->
  <main class="max-w-[1720px] mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-5" id="galleryGrid">
      <!-- Visual cards populated here -->
    </div>
  </main>

  <!-- Lightbox Modal (Full-Screen Immersive Cinema & Minimal Prompt Bar) -->
  <div id="lightboxModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex flex-col justify-between p-3 sm:p-6 opacity-0 pointer-events-none transition-opacity duration-200" onclick="if(event.target===this) closeLightbox();">
    
    <!-- Top Floating Header Bar -->
    <div class="max-w-6xl w-full mx-auto flex items-center justify-between gap-3 z-20 shrink-0">
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[#141518]/90 border border-white/[0.1] text-xs">
        <span id="lightboxNumber" class="font-mono text-[#e25c38] font-bold">#01</span>
        <span id="lightboxTitleCn" class="font-semibold text-white">厚涂油画</span>
        <span class="text-white/20">|</span>
        <span id="lightboxTitleEn" class="text-[#a1a1aa] font-mono">Impasto Oil Painting</span>
      </div>

      <button id="closeLightboxBtn" class="p-2 rounded-lg bg-[#141518]/90 hover:bg-[#202227] text-[#a1a1aa] hover:text-white border border-white/[0.1] transition-all" title="关闭 (Esc)">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Center: Large Fullscreen Artwork Viewport -->
    <div class="flex-1 w-full flex items-center justify-center p-2 sm:p-4 overflow-hidden relative min-h-0">
      <!-- Prev / Next Floating Navigation Buttons -->
      <button id="prevLightboxBtn" class="absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 z-20 p-3 rounded-full bg-[#141518]/80 hover:bg-[#e25c38] text-[#a1a1aa] hover:text-white border border-white/[0.1] backdrop-blur-md transition-all shadow-xl" title="上一张 (←)">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      <button id="nextLightboxBtn" class="absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 z-20 p-3 rounded-full bg-[#141518]/80 hover:bg-[#e25c38] text-[#a1a1aa] hover:text-white border border-white/[0.1] backdrop-blur-md transition-all shadow-xl" title="下一张 (→)">
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>

      <img id="lightboxImg" src="" alt="Artwork" class="max-h-[75vh] sm:max-h-[78vh] max-w-[95vw] object-contain rounded-lg shadow-2xl border border-white/[0.08] transition-all select-none">
    </div>

    <!-- Bottom: Floating Minimal Prompt Card -->
    <div class="max-w-4xl w-full mx-auto z-20 shrink-0">
      <div class="bg-[#141518]/95 backdrop-blur-md border border-white/[0.1] rounded-xl p-3 sm:p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-2xl">
        <p id="lightboxPromptText" class="font-mono text-xs text-[#e4e4e7] line-clamp-2 select-all leading-relaxed flex-1">
          Loading prompt...
        </p>
        <button id="lightboxCopyBtn" class="px-4 py-2.5 rounded-lg bg-[#e25c38] hover:bg-[#c8502e] text-white font-medium flex items-center justify-center gap-1.5 text-xs shrink-0 transition-all">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i>
          <span id="lightboxCopyBtnText">复制 Prompt</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-lg bg-[#141518] border border-white/[0.15] text-[#fbfbfa] text-xs font-medium shadow-2xl flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-200 pointer-events-none">
    <i data-lucide="check" class="w-4 h-4 text-[#e25c38]"></i>
    <span id="toastMsg">提示词已成功复制到剪贴板</span>
  </div>

  <!-- App Logic Scripts -->
  <script src="data.js"></script>
  <script>
    // State
    let currentSceneId = 'scene_a';
    let searchQuery = '';
    let activeLightboxIndex = 0;

    // DOM Elements
    const sceneTabsDesktop = document.getElementById('sceneTabsDesktop');
    const sceneSelectMobile = document.getElementById('sceneSelectMobile');
    const galleryGrid = document.getElementById('galleryGrid');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const randomStyleBtn = document.getElementById('randomStyleBtn');

    // Lightbox DOM
    const lightboxModal = document.getElementById('lightboxModal');
    const closeLightboxBtn = document.getElementById('closeLightboxBtn');
    const prevLightboxBtn = document.getElementById('prevLightboxBtn');
    const nextLightboxBtn = document.getElementById('nextLightboxBtn');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxNumber = document.getElementById('lightboxNumber');
    const lightboxTitleCn = document.getElementById('lightboxTitleCn');
    const lightboxTitleEn = document.getElementById('lightboxTitleEn');
    const lightboxPromptText = document.getElementById('lightboxPromptText');
    const lightboxCopyBtn = document.getElementById('lightboxCopyBtn');
    const lightboxCopyBtnText = document.getElementById('lightboxCopyBtnText');

    // Initialize
    function init() {
      renderSceneControls();
      renderGallery();
      initEventListeners();
      lucide.createIcons();
    }

    // Render Scene Controls (Desktop Wrapped Buttons + Mobile Select)
    function renderSceneControls() {
      // Desktop wrapped buttons
      sceneTabsDesktop.innerHTML = SCENES_DATA.map(scene => {
        const isActive = scene.id === currentSceneId;
        const cleanTitle = scene.title.split('·')[1] ? scene.title.split('·')[1].trim() : scene.title;

        return `
          <button onclick="switchScene('${scene.id}')" 
            class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all border shrink-0 ${
              isActive 
                ? 'bg-[#e25c38] text-white border-[#e25c38] shadow-sm font-semibold' 
                : 'bg-[#141518] hover:bg-[#202227] text-[#a1a1aa] hover:text-white border-white/[0.08]'
            }">
            <span>${cleanTitle}</span>
            <span class="text-[10px] font-mono opacity-60 ml-0.5">${scene.aspectRatio}</span>
          </button>
        `;
      }).join('');

      // Mobile Select options
      sceneSelectMobile.innerHTML = SCENES_DATA.map(scene => {
        const cleanTitle = scene.title.split('·')[1] ? scene.title.split('·')[1].trim() : scene.title;
        return `<option value="${scene.id}" ${scene.id === currentSceneId ? 'selected' : ''}>${cleanTitle} (${scene.aspectRatio})</option>`;
      }).join('');

      lucide.createIcons();
    }

    // Switch Scene
    function switchScene(sceneId) {
      currentSceneId = sceneId;
      renderSceneControls();
      renderGallery();
    }
    window.switchScene = switchScene;

    // Filter Logic
    function getFilteredStyles() {
      const scene = SCENES_DATA.find(s => s.id === currentSceneId);
      if (!scene) return [];

      return scene.styles.filter(item => {
        return !searchQuery || 
          item.nameCn.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.nameEn.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (item.master && item.master.toLowerCase().includes(searchQuery.toLowerCase())) ||
          item.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase())) ||
          (item.prompt && item.prompt.toLowerCase().includes(searchQuery.toLowerCase()));
      });
    }

    // Render Clean Visual Gallery Cards
    function renderGallery() {
      const scene = SCENES_DATA.find(s => s.id === currentSceneId);
      const isLandscape = scene && scene.aspectRatio === '16:9';
      const aspectClass = isLandscape ? 'aspect-[16/9]' : 'aspect-[3/4]';

      const items = getFilteredStyles();
      if (items.length === 0) {
        galleryGrid.innerHTML = `
          <div class="col-span-full py-20 text-center text-[#71717a] bg-[#141518] rounded-xl border border-white/[0.06]">
            <i data-lucide="search-x" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
            <p class="text-sm font-medium text-white">未找到匹配画风</p>
            <p class="text-xs text-[#71717a] mt-1">请尝试其他关键词</p>
            <button onclick="clearSearch()" class="mt-4 px-3 py-1.5 rounded-lg bg-[#202227] text-xs text-[#a1a1aa] hover:text-white border border-white/[0.08]">
              清空搜索
            </button>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      galleryGrid.innerHTML = items.map(item => {
        const thumbSrc = item.image.replace('images/', 'images/thumbs/');
        return `
          <div class="art-card flex flex-col justify-between group">
            <div class="art-card-media ${aspectClass}" onclick="openLightbox('${item.id}')">
              <img src="${thumbSrc}" alt="${item.nameCn}" loading="lazy" decoding="async">
              
              <!-- Number badge on top left -->
              <div class="absolute top-2.5 left-2.5 z-10 pointer-events-none">
                <span class="px-2 py-0.5 rounded text-[11px] font-mono font-medium bg-[#090a0c]/80 text-[#f4f4f5] border border-white/[0.1] backdrop-blur-md">
                  #${item.number}
                </span>
              </div>

              <!-- Floating Bottom Info on Image -->
              <div class="absolute inset-x-0 bottom-0 p-2.5 sm:p-3 bg-gradient-to-t from-black/90 via-black/50 to-transparent flex items-end justify-between gap-2 z-10">
                <div class="min-w-0">
                  <div class="text-xs sm:text-sm font-semibold text-white truncate">${item.nameCn}</div>
                  <div class="text-[10px] font-mono text-[#a1a1aa] truncate">${item.nameEn}</div>
                </div>
                <button onclick="event.stopPropagation(); copyPrompt('${item.id}', this)" 
                  class="px-2 py-1 rounded bg-white/10 hover:bg-[#e25c38] text-white border border-white/15 text-[11px] font-mono flex items-center gap-1 transition-all shrink-0 backdrop-blur-md" title="复制提示词">
                  <i data-lucide="copy" class="w-3 h-3"></i>
                  <span class="hidden sm:inline">复制</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    // Copy Prompt
    function copyPrompt(styleId, btnEl) {
      const scene = SCENES_DATA.find(s => s.id === currentSceneId);
      if (!scene) return;
      const item = scene.styles.find(st => st.id === styleId);
      if (!item) return;

      navigator.clipboard.writeText(item.prompt).then(() => {
        if (btnEl) {
          const originalHtml = btnEl.innerHTML;
          btnEl.innerHTML = `<i data-lucide="check" class="w-3 h-3 text-[#e25c38]"></i><span class="text-[#e25c38]">已复制</span>`;
          lucide.createIcons();
          setTimeout(() => {
            btnEl.innerHTML = originalHtml;
            lucide.createIcons();
          }, 1600);
        }
        showToast(`已复制【${item.nameCn}】出图 Prompt`);
      }).catch(() => {
        showToast('复制失败，请手动选取');
      });
    }
    window.copyPrompt = copyPrompt;

    // Toast Notification
    function showToast(msg) {
      toastMsg.innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
      }, 2000);
    }

    // Clear search
    function clearSearch() {
      searchInput.value = '';
      searchQuery = '';
      clearSearchBtn.classList.add('hidden');
      renderGallery();
    }
    window.clearSearch = clearSearch;

    // Lightbox Logic
    function openLightbox(styleId) {
      const scene = SCENES_DATA.find(s => s.id === currentSceneId);
      if (!scene) return;
      const idx = scene.styles.findIndex(st => st.id === styleId);
      if (idx === -1) return;

      activeLightboxIndex = idx;
      updateLightboxContent();
      lightboxModal.classList.remove('opacity-0', 'pointer-events-none');
      document.body.style.overflow = 'hidden';
    }
    window.openLightbox = openLightbox;

    function updateLightboxContent() {
      const scene = SCENES_DATA.find(s => s.id === currentSceneId);
      if (!scene) return;
      const item = scene.styles[activeLightboxIndex];
      if (!item) return;

      const thumbSrc = item.image.replace('images/', 'images/thumbs/');
      const fullSrc = item.image;

      // Show thumbnail immediately as fast placeholder
      lightboxImg.src = thumbSrc;
      lightboxImg.alt = item.nameCn;

      // Preload full resolution image and swap seamlessly
      const highRes = new Image();
      highRes.src = fullSrc;
      highRes.onload = () => {
        if (scene.styles[activeLightboxIndex] && scene.styles[activeLightboxIndex].id === item.id) {
          lightboxImg.src = fullSrc;
        }
      };

      lightboxNumber.innerText = `#${item.number}`;
      lightboxTitleCn.innerText = item.nameCn;
      if (lightboxTitleEn) lightboxTitleEn.innerText = item.nameEn;
      lightboxPromptText.innerText = item.prompt;
      
      // Reset zoom state on change
      lightboxImg.classList.remove('scale-125', 'cursor-zoom-out');
      lightboxImg.classList.add('cursor-zoom-in');

      lightboxCopyBtn.onclick = () => {
        navigator.clipboard.writeText(item.prompt).then(() => {
          lightboxCopyBtnText.innerText = '已复制！';
          setTimeout(() => { lightboxCopyBtnText.innerText = '复制 Prompt'; }, 1600);
          showToast(`已复制【${item.nameCn}】出图 Prompt`);
        });
      };

      lucide.createIcons();
    }

    // Toggle Image Zoom on Click in Lightbox
    lightboxImg.onclick = (e) => {
      e.stopPropagation();
      const isZoomed = lightboxImg.classList.contains('scale-125');
      if (isZoomed) {
        lightboxImg.classList.remove('scale-125', 'cursor-zoom-out');
        lightboxImg.classList.add('cursor-zoom-in');
      } else {
        lightboxImg.classList.add('scale-125', 'cursor-zoom-out');
        lightboxImg.classList.remove('cursor-zoom-in');
      }
    };

    function closeLightbox() {
      lightboxModal.classList.add('opacity-0', 'pointer-events-none');
      document.body.style.overflow = '';
    }

    // Lightbox Nav
    prevLightboxBtn.onclick = () => {
      const scene = SCENES_DATA.find(s => s.id === currentSceneId);
      if (!scene) return;
      activeLightboxIndex = (activeLightboxIndex - 1 + scene.styles.length) % scene.styles.length;
      updateLightboxContent();
    };

    nextLightboxBtn.onclick = () => {
      const scene = SCENES_DATA.find(s => s.id === currentSceneId);
      if (!scene) return;
      activeLightboxIndex = (activeLightboxIndex + 1) % scene.styles.length;
      updateLightboxContent();
    };

    closeLightboxBtn.onclick = closeLightbox;

    // Event Listeners
    function initEventListeners() {
      // Search
      searchInput.oninput = (e) => {
        searchQuery = e.target.value.trim();
        clearSearchBtn.classList.toggle('hidden', searchQuery.length === 0);
        renderGallery();
      };
      clearSearchBtn.onclick = clearSearch;

      // Keyboard Shortcut '/' for search and Escape to close modal
      window.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput && lightboxModal.classList.contains('opacity-0')) {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === 'Escape' && !lightboxModal.classList.contains('opacity-0')) {
          closeLightbox();
        } else if (!lightboxModal.classList.contains('opacity-0')) {
          if (e.key === 'ArrowLeft') {
            prevLightboxBtn.click();
          } else if (e.key === 'ArrowRight') {
            nextLightboxBtn.click();
          }
        }
      });

      // Random Style
      randomStyleBtn.onclick = () => {
        const scene = SCENES_DATA.find(s => s.id === currentSceneId);
        if (!scene) return;
        const randomItem = scene.styles[Math.floor(Math.random() * scene.styles.length)];
        openLightbox(randomItem.id);
        showToast(`随机抽取：【${randomItem.nameCn}】`);
      };
    }

    // Run
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
